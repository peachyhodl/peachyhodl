name = "peachyhodl-twitch"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Route: intercept /twitch/* on the apex domain (zone must be on Cloudflare,
# which it already is — peachyhodl.com is proxied). The site itself stays on
# GitHub Pages; only /twitch/* is served by this worker.
routes = [
  { pattern = "peachyhodl.com/twitch/*", zone_name = "peachyhodl.com" }
]

# Secrets are managed from GitHub Secrets + the twitch-secrets workflow
# (TWITCH_CLIENT_ID, TWITCH_REFRESH_TOKEN, TWITCH_ACCESS_TOKEN,
#  TWITCH_SETUP_KEY; TWITCH_CLIENT_SECRET optional — Peachy's app is a
# Public client type, so the flow uses PKCE and no secret). Never commit them.
#
# KV is REQUIRED for refresh mode: it persists rotated refresh tokens
# (Public-client refresh tokens expire after 30 days unless rotated) and the
# short-lived access token. The deploy workflow provisions the namespace via
# the Cloudflare API and fills the id in at deploy time.
[[kv_namespaces]]
binding = "TWITCH_KV"
id = "<kv-namespace-id>"

[triggers]
# Refresh-token keep-alive for Public client types: each refresh issues a
# fresh 30-day refresh token, so running every few days keeps the auth alive.
crons = ["0 9 */5 * *"]

[observability]
enabled = true
