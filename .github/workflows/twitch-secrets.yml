name: Twitch Secrets → Worker

# Admin runbook:
#
# FIRST-TIME SETUP (refresh-token mode — self-healing, recommended)
#   1. Add repo secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit,
#      Workers Routes:Edit, Workers KV Storage:Edit on zone peachyhodl.com),
#      CLOUDFLARE_ACCOUNT_ID, TWITCH_CLIENT_ID, TWITCH_SETUP_KEY (any long
#      random string). TWITCH_CLIENT_SECRET not needed — Peachy's app is a
#      Public client type; the worker uses PKCE.
#      ALSO in the Twitch dev console: add redirect URI
#      https://peachyhodl.com/twitch/oauth/callback to the app.
#   2. Run this workflow once (it deploys the worker + secrets + KV).
#   3. Open https://peachyhodl.com/twitch/oauth/setup?key=<TWITCH_SETUP_KEY>
#      while logged in to Twitch AS peachyhodl → approve → the callback page
#      shows the refresh token.
#   4. Paste it into repo secret TWITCH_REFRESH_TOKEN → run this workflow again.
#   Done. The worker refreshes the access token automatically, and a cron
#   (every 5 days) rotates the refresh token so a Public client's 30-day
#   refresh-token expiry never bites.
#
# MANUAL MODE (fallback)
#   - Set TWITCH_ACCESS_TOKEN repo secret instead of doing the setup flow.
#     Token expires (~4h for user tokens) → /twitch/validate reports invalid →
#     paste a fresh token into the secret and re-run this workflow.
#
# UPDATING ANY VALUE
#   - Edit the repo secret → run this workflow. That's it.

on:
  workflow_dispatch:
    inputs:
      deploy_only:
        description: 'Deploy worker code only (skip re-pushing secrets)'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: twitch-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wrangler
        run: npm install -g wrangler@latest

      - name: Ensure KV namespace exists
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          ID=$(curl -s "$API?title=peachyhodl-twitch-kv" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | jq -r '.result[] | select(.title=="peachyhodl-twitch-kv") | .id' | head -1)
          if [ -z "$ID" ]; then
            ID=$(curl -s -X POST "$API" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" -d '{"title":"peachyhodl-twitch-kv"}' \
              | jq -r '.result.id // empty')
          fi
          if [ -z "$ID" ]; then
            echo "::error::Could not create or find KV namespace peachyhodl-twitch-kv (check the API token has Workers KV Storage:Edit)"
            exit 1
          fi
          echo "KV namespace id: $ID"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Wire KV binding into wrangler.toml
        env:
          KV_ID: ${{ steps.kv.outputs.id }}
        run: |
          set -e
          sed -i 's|<kv-namespace-id>|'"$KV_ID"'|' worker/wrangler.toml
          grep -A1 'kv_namespaces' worker/wrangler.toml

      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: worker
        run: wrangler deploy

      - name: Push secrets to Cloudflare Worker
        if: inputs.deploy_only != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_REFRESH_TOKEN: ${{ secrets.TWITCH_REFRESH_TOKEN }}
          TWITCH_ACCESS_TOKEN: ${{ secrets.TWITCH_ACCESS_TOKEN }}
          TWITCH_SETUP_KEY: ${{ secrets.TWITCH_SETUP_KEY }}
        working-directory: worker
        run: |
          set -e
          for s in TWITCH_CLIENT_ID TWITCH_CLIENT_SECRET TWITCH_REFRESH_TOKEN TWITCH_ACCESS_TOKEN TWITCH_SETUP_KEY; do
            val="${!s}"
            if [ -n "$val" ]; then
              echo "setting secret: $s"
              echo "$val" | wrangler secret put "$s"
            else
              echo "secret $s not set in repo — skipping"
            fi
          done

      - name: Smoke check
        run: |
          sleep 5
          echo "health:";  curl -s https://peachyhodl.com/twitch/health
          echo; echo "validate:"; curl -s https://peachyhodl.com/twitch/validate
