name: Twitch Secrets → Worker

# Admin runbook:
#
# FIRST-TIME SETUP (refresh-token mode — self-healing, recommended)
#   1. Add repo secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit on zone
#      peachyhodl.com), CLOUDFLARE_ACCOUNT_ID, TWITCH_CLIENT_ID,
#      TWITCH_CLIENT_SECRET, TWITCH_SETUP_KEY (any long random string).
#   2. Run this workflow once (it deploys the worker + secrets).
#   3. Open https://peachyhodl.com/twitch/oauth/setup?key=<TWITCH_SETUP_KEY>
#      while logged in to Twitch AS peachyhodl → approve → the callback page
#      shows the refresh token.
#   4. Paste it into repo secret TWITCH_REFRESH_TOKEN → run this workflow again.
#   Done. The worker refreshes the access token automatically from now on.
#
# MANUAL MODE (fallback)
#   - Set TWITCH_ACCESS_TOKEN repo secret instead of doing the setup flow.
#     Token expires (~60d) → /twitch/validate reports invalid → paste a fresh
#     token into the secret and re-run this workflow.
#
# UPDATING ANY VALUE
#   - Edit the repo secret → run this workflow. That's it.

on:
  workflow_dispatch:
    inputs:
      deploy_only:
        description: 'Deploy worker code only (skip re-pushing secrets)'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: twitch-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wrangler
        run: npm install -g wrangler@latest

      - name: Push secrets to Cloudflare Worker
        if: inputs.deploy_only != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: worker
        run: |
          set -e
          for s in TWITCH_CLIENT_ID TWITCH_CLIENT_SECRET TWITCH_REFRESH_TOKEN TWITCH_ACCESS_TOKEN TWITCH_SETUP_KEY; do
            val="${!s}"
            if [ -n "$val" ]; then
              echo "setting secret: $s"
              echo "$val" | wrangler secret put "$s"
            else
              echo "secret $s not set in repo — skipping"
            fi
          done

      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: worker
        run: wrangler deploy

      - name: Smoke check
        run: |
          sleep 5
          echo "health:";  curl -s https://peachyhodl.com/twitch/health
          echo; echo "validate:"; curl -s https://peachyhodl.com/twitch/validate
